<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; media-src data: blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';">
  <title>Arena Whiteboard Player</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --paper: #f8fafc;
      --line: #cbd5e1;
      --cyan: #06b6d4;
      --blue: #2563eb;
      --violet: #7c3aed;
      --amber: #d97706;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overflow: auto; }
    .root { min-height: 100vh; padding: 24px; background:
      radial-gradient(circle at 18% 12%, rgba(6, 182, 212, 0.18), transparent 26%),
      radial-gradient(circle at 84% 18%, rgba(124, 58, 237, 0.16), transparent 30%),
      linear-gradient(135deg, #f8fafc 0%, #eef6ff 52%, #fff7ed 100%);
    }
    .shell { max-width: 1180px; margin: 0 auto; }
    .hero { display: grid; gap: 12px; margin-bottom: 18px; }
    .kicker { margin: 0; color: #0891b2; font-size: 12px; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 46px); line-height: 1.05; letter-spacing: -0.045em; }
    .summary { display: grid; gap: 8px; margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .custom-html { min-height: 520px; }
    .custom-html > * { max-width: 100%; }
    .timeline { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 22px 0; }
    .timeline::before { content: ""; position: absolute; left: 7%; right: 7%; top: 38px; height: 4px; border-radius: 99px; background: linear-gradient(90deg, var(--cyan), var(--violet), var(--green)); transform-origin: left; animation: grow 1.2s 0.15s both cubic-bezier(.22,1,.36,1); }
    .step { position: relative; z-index: 1; min-height: 180px; border: 1px solid rgba(148, 163, 184, .45); border-radius: 22px; background: rgba(255,255,255,.88); padding: 16px; box-shadow: 0 20px 55px rgba(15, 23, 42, .08); backdrop-filter: blur(12px); opacity: 0; transform: translateY(18px) scale(.97); animation: cardIn .62s both cubic-bezier(.22,1,.36,1); }
    .step:nth-child(2) { animation-delay: .18s; }
    .step:nth-child(3) { animation-delay: .36s; }
    .step:nth-child(4) { animation-delay: .54s; }
    .step:nth-child(5) { animation-delay: .72s; }
    .badge { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 16px; background: #0f172a; color: #fff; font-size: 17px; font-weight: 950; box-shadow: 0 10px 28px rgba(15, 23, 42, .18); }
    .stage { margin: 14px 0 4px; color: #0891b2; font-size: 11px; font-weight: 950; text-transform: uppercase; letter-spacing: .12em; }
    .title { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 950; letter-spacing: -0.02em; }
    .text { margin: 10px 0 0; color: #475569; font-size: 13px; line-height: 1.58; }
    .formula-flow { margin-top: 20px; display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 10px; align-items: center; border-radius: 24px; background: #0f172a; color: #e0f2fe; padding: 18px; overflow: hidden; box-shadow: inset 0 1px rgba(255,255,255,.08), 0 22px 50px rgba(15,23,42,.22); }
    .formula-box { border: 1px solid rgba(125, 211, 252, .24); border-radius: 18px; padding: 14px; background: rgba(15, 23, 42, .74); min-height: 112px; opacity: 0; animation: glowIn .62s both ease-out; }
    .formula-box:nth-child(3) { animation-delay: .28s; }
    .formula-box:nth-child(5) { animation-delay: .56s; }
    .formula-label { margin: 0 0 8px; color: #67e8f9; font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .formula-text { margin: 0; color: #f8fafc; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; line-height: 1.6; }
    .arrow { width: 42px; height: 4px; border-radius: 99px; background: linear-gradient(90deg, #22d3ee, #a78bfa); transform-origin: left; animation: grow .8s .34s both; }
    .diagram { margin-top: 22px; border: 1px solid rgba(148, 163, 184, .48); border-radius: 26px; background: rgba(255,255,255,.88); padding: 16px; box-shadow: 0 22px 60px rgba(15, 23, 42, .09); }
    .diagram-title { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 950; letter-spacing: .16em; text-transform: uppercase; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: nodeIn .58s both cubic-bezier(.22,1,.36,1); }
    .node:nth-of-type(2) { animation-delay: .18s; }
    .node:nth-of-type(3) { animation-delay: .36s; }
    .node:nth-of-type(4) { animation-delay: .54s; }
    .node:nth-of-type(5) { animation-delay: .72s; }
    .edge { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1s .25s both ease-out; }
    @keyframes cardIn { to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes glowIn { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes nodeIn { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (max-width: 820px) {
      .root { padding: 14px; }
      .timeline { grid-template-columns: 1fr; }
      .timeline::before { left: 34px; right: auto; top: 42px; bottom: 42px; width: 4px; height: auto; transform-origin: top; animation-name: growY; }
      .formula-flow { grid-template-columns: 1fr; }
      .arrow { width: 4px; height: 34px; margin: 0 auto; transform-origin: top; animation-name: growY; }
    }
    @keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  </style>
</head>
<body>
  <main id="root" class="root">
    <div class="shell">
      <p class="kicker">Arena HTML Whiteboard</p>
      <h1>Waiting for whiteboard data...</h1>
    </div>
  </main>
  <script>
    const root = document.getElementById('root');
    const colors = ['#06b6d4', '#7c3aed', '#d97706', '#16a34a', '#2563eb', '#db2777'];

    function text(value, fallback = '') {
      return String(value || fallback).replace(/\s+/g, ' ').trim();
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function sanitizeHtml(html) {
      return String(html || '')
        .replace(/<!doctype[\s\S]*?>/gi, '')
        .replace(/<\/?(html|head|body|meta)[^>]*>/gi, '')
        .replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '')
        .replace(/<iframe[\s\S]*?>[\s\S]*?<\/iframe>/gi, '')
        .replace(/<object[\s\S]*?>[\s\S]*?<\/object>/gi, '')
        .replace(/<embed[\s\S]*?>[\s\S]*?<\/embed>/gi, '')
        .replace(/\s+on[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
        .replace(/javascript:/gi, '');
    }

    function visibleSteps(payload) {
      const steps = Array.isArray(payload.steps) ? payload.steps : [];
      if (steps.length) return steps.slice(0, 6);
      return [
        { title: payload.locale === 'zh' ? '定义变量' : 'Define variables', markdown: payload.locale === 'zh' ? '明确已知量、目标和约束。' : 'Clarify known quantities, goal, and constraints.' },
        { title: payload.locale === 'zh' ? '建立关系' : 'Build relation', markdown: payload.locale === 'zh' ? '找到公式、不变量或机制主链路。' : 'Identify the formula, invariant, or main mechanism path.' },
        { title: payload.locale === 'zh' ? '状态变换' : 'Transform state', markdown: payload.locale === 'zh' ? '展示中间状态如何演化。' : 'Show how intermediate state evolves.' },
        { title: payload.locale === 'zh' ? '边界检查' : 'Boundary check', markdown: payload.locale === 'zh' ? '验证输出、指标和失败情况。' : 'Validate output, metric, and failure cases.' },
      ];
    }

    function formulaText(step, fallback) {
      const source = `${step.markdown || ''} ${step.title || ''}`;
      const formula = source.match(/\$\$?([^$]{4,160})\$\$?/);
      return text(formula && formula[1], fallback).slice(0, 150);
    }

    function renderGenerated(payload) {
      const locale = payload.locale === 'zh' ? 'zh' : 'en';
      const steps = visibleSteps(payload);
      const title = text(payload.title, locale === 'zh' ? '原理动画白板' : 'Animated principle board');
      const summary = Array.isArray(payload.summary) ? payload.summary.slice(0, 3) : [];
      const first = steps[0] || {};
      const mid = steps[Math.min(1, steps.length - 1)] || {};
      const last = steps[steps.length - 1] || {};
      root.innerHTML = `
        <div class="shell">
          <section class="hero">
            <p class="kicker">${locale === 'zh' ? '本地 HTML 动画生成' : 'Local HTML animation generated'}</p>
            <h1>${escapeHtml(title)}</h1>
            <div class="summary">
              ${(summary.length ? summary : [locale === 'zh' ? '根据白板 steps/markdown 自动生成动画视图。' : 'Generated from whiteboard steps/markdown locally.']).map((item) => `<p>${escapeHtml(item)}</p>`).join('')}
            </div>
          </section>
          <section class="timeline">
            ${steps.map((step, index) => `
              <article class="step">
                <span class="badge">${index + 1}</span>
                <p class="stage">${escapeHtml(step.stage || (locale === 'zh' ? '阶段' : 'stage'))}</p>
                <h2 class="title">${escapeHtml(step.title || `${locale === 'zh' ? '步骤' : 'Step'} ${index + 1}`)}</h2>
                <p class="text">${escapeHtml(text(step.markdown || (Array.isArray(step.summary) ? step.summary.join(' ') : ''), locale === 'zh' ? '等待解释内容。' : 'Waiting for explanation.')).slice(0, 260)}</p>
              </article>
            `).join('')}
          </section>
          <section class="formula-flow">
            <div class="formula-box">
              <p class="formula-label">${locale === 'zh' ? '输入 / 已知量' : 'Input / known'}</p>
              <p class="formula-text">${escapeHtml(formulaText(first, locale === 'zh' ? 'x, 条件, 约束' : 'x, conditions, constraints'))}</p>
            </div>
            <div class="arrow"></div>
            <div class="formula-box">
              <p class="formula-label">${locale === 'zh' ? '核心关系 / 变换' : 'Core relation / transform'}</p>
              <p class="formula-text">${escapeHtml(formulaText(mid, locale === 'zh' ? 'y = f(x, θ)' : 'y = f(x, theta)'))}</p>
            </div>
            <div class="arrow"></div>
            <div class="formula-box">
              <p class="formula-label">${locale === 'zh' ? '输出 / 检查' : 'Output / check'}</p>
              <p class="formula-text">${escapeHtml(formulaText(last, locale === 'zh' ? '结论 + 边界检查' : 'answer + boundary check'))}</p>
            </div>
          </section>
          <section class="diagram">
            <p class="diagram-title">${locale === 'zh' ? '最终总图' : 'Final diagram'}</p>
            ${renderSvg(steps, locale)}
          </section>
        </div>
      `;
    }

    function renderSvg(steps, locale) {
      const visible = steps.slice(0, Math.min(5, steps.length || 4));
      const width = 980;
      const height = 260;
      const gap = width / Math.max(visible.length, 1);
      const nodes = visible.map((step, index) => {
        const x = 54 + index * gap;
        const y = index % 2 ? 132 : 52;
        const color = colors[index % colors.length];
        const label = escapeHtml(text(step.title, `${locale === 'zh' ? '步骤' : 'Step'} ${index + 1}`).slice(0, 32));
        return { x, y, color, label, index };
      });
      const edges = nodes.slice(1).map((node, index) => {
        const prev = nodes[index];
        return `<path class="edge" d="M ${prev.x + 150} ${prev.y + 44} C ${prev.x + 205} ${prev.y + 44}, ${node.x - 55} ${node.y + 44}, ${node.x} ${node.y + 44}" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" style="animation-delay:${0.2 + index * 0.16}s"></path>`;
      }).join('');
      const boxes = nodes.map((node) => `
        <g class="node" style="animation-delay:${0.1 + node.index * 0.16}s">
          <rect x="${node.x}" y="${node.y}" width="150" height="88" rx="18" fill="#fff" stroke="${node.color}" stroke-width="3"></rect>
          <circle cx="${node.x + 24}" cy="${node.y + 24}" r="14" fill="${node.color}"></circle>
          <text x="${node.x + 24}" y="${node.y + 29}" text-anchor="middle" fill="#fff" font-size="13" font-weight="900">${node.index + 1}</text>
          <foreignObject x="${node.x + 18}" y="${node.y + 42}" width="114" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px;font-weight:850;line-height:1.25;color:#0f172a;text-align:center">${node.label}</div></foreignObject>
        </g>
      `).join('');
      return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Final animated diagram">
        <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"></path></marker></defs>
        ${edges}
        ${boxes}
      </svg>`;
    }

    function renderPayload(payload) {
      if (payload && payload.html) {
        root.innerHTML = `<div class="shell custom-html">${sanitizeHtml(payload.html)}</div>`;
        return;
      }
      renderGenerated(payload || {});
    }

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type !== 'arena-whiteboard-render') return;
      renderPayload(data.payload || {});
    });
  </script>
</body>
</html>
