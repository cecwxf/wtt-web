<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Inter', 'SF Pro Display', 'PingFang SC', system-ui, sans-serif; }
    .title { font-size: 28px; fill: #1e293b; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #64748b; }
    .phase { font-size: 12px; fill: #fff; font-weight: 700; letter-spacing: 0.05em; }
    .box-title { font-size: 18px; fill: #1e293b; font-weight: 700; }
    .box-item { font-size: 13px; fill: #475569; }
    .box-em { font-size: 13px; fill: #4f46e5; font-weight: 600; }
    .box-green { font-size: 13px; fill: #059669; font-weight: 600; }
    .box-red { font-size: 13px; fill: #dc2626; font-weight: 600; }
    .note { font-size: 11px; fill: #94a3b8; }
    .label { font-size: 14px; fill: #1e293b; font-weight: 600; }
    .arrow-label { font-size: 11px; fill: #4f46e5; font-weight: 600; }
  </style>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f46e5"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#059669"/></marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/></filter>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="40" y="40" width="1520" height="820" rx="20" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <text x="80" y="92" class="title">P2P End-to-End Encryption</text>
  <text x="80" y="118" class="subtitle">HTTP key bootstrap + internal WebSocket bridge · Endpoint-only encryption/decryption · Server sees only ciphertext</text>

  <!-- Phase A: Key Bootstrap -->
  <rect x="80" y="148" width="200" height="28" rx="14" fill="#4f46e5"/>
  <text x="100" y="167" class="phase">PHASE A · KEY BOOTSTRAP</text>

  <rect x="80" y="192" width="400" height="220" rx="14" fill="#f0f0ff" stroke="#c7d2fe"/>
  <rect x="100" y="206" width="36" height="36" rx="8" fill="#4f46e5"/>
  <text x="106" y="230" font-size="18" fill="#fff">🌐</text>
  <text x="148" y="228" class="box-title">WTT Web (Browser)</text>
  <text x="100" y="260" class="box-item">1. User logs in + selects agent</text>
  <text x="100" y="282" class="box-em">2. GET /agents/e2e-key?agent_id=xxx</text>
  <text x="100" y="304" class="box-item">3. Receives key_b64 from server</text>
  <text x="100" y="326" class="box-item">4. Caches in localStorage</text>
  <text x="100" y="348" class="box-item">5. Uses key to decrypt P2P messages</text>
  <text x="100" y="380" class="note">Auto-refreshes key when switching agents</text>

  <rect x="530" y="192" width="400" height="220" rx="14" fill="#ecfeff" stroke="#a5f3fc"/>
  <rect x="550" y="206" width="36" height="36" rx="8" fill="#0891b2"/>
  <text x="556" y="230" font-size="18" fill="#fff">☁️</text>
  <text x="598" y="228" class="box-title">WTT Service (Relay)</text>
  <text x="550" y="260" class="box-item">1. Verifies user-agent binding</text>
  <text x="550" y="282" class="box-em">2. Bridges request via WebSocket</text>
  <text x="550" y="304" class="box-item">   to online agent plugin</text>
  <text x="550" y="326" class="box-item">3. Receives e2e_key_response</text>
  <text x="550" y="348" class="box-item">4. Returns key_b64 to browser</text>
  <text x="550" y="380" class="box-red">⚠ Server NEVER stores the key</text>

  <rect x="980" y="192" width="400" height="220" rx="14" fill="#faf5ff" stroke="#d8b4fe"/>
  <rect x="1000" y="206" width="36" height="36" rx="8" fill="#7c3aed"/>
  <text x="1006" y="230" font-size="18" fill="#fff">🤖</text>
  <text x="1048" y="228" class="box-title">Agent Plugin (wtt-plugin)</text>
  <text x="1000" y="260" class="box-item">1. Has local e2ePassword in config</text>
  <text x="1000" y="282" class="box-em">2. Derives E2E key (PBKDF2/SHA-256)</text>
  <text x="1000" y="304" class="box-item">3. Responds to e2e_key_request</text>
  <text x="1000" y="326" class="box-item">   with key_b64 via WebSocket</text>
  <text x="1000" y="348" class="box-item">4. Uses same key for encrypt/decrypt</text>
  <text x="1000" y="380" class="box-green">✓ Key never leaves plugin memory</text>

  <!-- Phase A arrows -->
  <line x1="480" y1="280" x2="530" y2="280" stroke="#4f46e5" stroke-width="2" marker-end="url(#a2)"/>
  <text x="488" y="272" class="arrow-label">request</text>
  <line x1="930" y1="280" x2="980" y2="280" stroke="#4f46e5" stroke-width="2" marker-end="url(#a2)"/>
  <text x="938" y="272" class="arrow-label">WS bridge</text>
  <line x1="980" y1="320" x2="930" y2="320" stroke="#059669" stroke-width="2" marker-end="url(#a3)"/>
  <text x="938" y="340" class="arrow-label" style="fill:#059669">key_b64</text>
  <line x1="530" y1="320" x2="480" y2="320" stroke="#059669" stroke-width="2" marker-end="url(#a3)"/>
  <text x="488" y="340" class="arrow-label" style="fill:#059669">key_b64</text>

  <!-- Phase B: Message Encryption -->
  <rect x="80" y="440" width="240" height="28" rx="14" fill="#059669"/>
  <text x="100" y="459" class="phase">PHASE B · MESSAGE ENCRYPTION</text>

  <rect x="80" y="484" width="440" height="200" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="100" y="498" width="36" height="36" rx="8" fill="#059669"/>
  <text x="106" y="522" font-size="18" fill="#fff">🔒</text>
  <text x="148" y="520" class="box-title">Sender (Encrypt)</text>
  <text x="100" y="554" class="box-item">plaintext → AES-256-GCM encrypt</text>
  <text x="100" y="576" class="box-em">Envelope: { c: ciphertext, ctx: nonce }</text>
  <text x="100" y="598" class="box-item">POST /topics/:id/messages</text>
  <text x="100" y="620" class="box-item">with encrypted=true flag</text>
  <text x="100" y="656" class="note">Browser or Plugin — both use same key</text>

  <rect x="580" y="484" width="440" height="200" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="600" y="498" width="36" height="36" rx="8" fill="#64748b"/>
  <text x="606" y="522" font-size="18" fill="#fff">📦</text>
  <text x="648" y="520" class="box-title">WTT Service (Relay Only)</text>
  <text x="600" y="554" class="box-item">Stores message with encrypted=true</text>
  <text x="600" y="576" class="box-em">Content = ciphertext { c, ctx }</text>
  <text x="600" y="598" class="box-item">Broadcasts new_message to topic members</text>
  <text x="600" y="620" class="box-item">No source-prefix injection (preserves ciphertext)</text>
  <text x="600" y="656" class="box-red">✗ No key, no plaintext, cannot decrypt</text>

  <rect x="1080" y="484" width="440" height="200" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="1100" y="498" width="36" height="36" rx="8" fill="#059669"/>
  <text x="1106" y="522" font-size="18" fill="#fff">🔓</text>
  <text x="1148" y="520" class="box-title">Receiver (Decrypt)</text>
  <text x="1100" y="554" class="box-item">Checks encrypted flag on message</text>
  <text x="1100" y="576" class="box-em">AES-256-GCM decrypt(key, c, ctx)</text>
  <text x="1100" y="598" class="box-item">Renders plaintext in UI / processes</text>
  <text x="1100" y="620" class="box-item">by agent for inference</text>
  <text x="1100" y="656" class="note">If key missing: shows 🔒 placeholder + retries bootstrap</text>

  <!-- Phase B arrows -->
  <line x1="520" y1="580" x2="580" y2="580" stroke="#94a3b8" stroke-width="3" marker-end="url(#a1)"/>
  <text x="534" y="572" class="note">ciphertext</text>
  <line x1="1020" y1="580" x2="1080" y2="580" stroke="#94a3b8" stroke-width="3" marker-end="url(#a1)"/>
  <text x="1034" y="572" class="note">ciphertext</text>

  <!-- Security guarantees -->
  <rect x="80" y="718" width="1440" height="110" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="110" y="750" class="label" style="fill:#dc2626">🛡 Security Guarantees</text>
  <text x="110" y="778" class="box-item">• <tspan font-weight="600">Endpoint-only keys</tspan>: E2E key exists only in browser localStorage and plugin memory. Server is a relay.</text>
  <text x="110" y="800" class="box-item">• <tspan font-weight="600">P2P scope only</tspan>: Encryption applies to P2P private chats. Discussion and task messages are not encrypted (by design).</text>
  <text x="110" y="822" class="box-item">• <tspan font-weight="600">Auto key refresh</tspan>: Switching agents triggers new key bootstrap. No manual password entry required.</text>
</svg>