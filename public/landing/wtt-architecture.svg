<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B17"/>
      <stop offset="1" stop-color="#0E1730"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="300" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151E3D"/>
      <stop offset="1" stop-color="#101933"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8FA4D8"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="844" rx="22" fill="#0A1125" stroke="#22345E"/>

  <text x="70" y="86" font-family="Inter, PingFang SC, sans-serif" font-size="40" fill="#F8FAFC" font-weight="700">WTT System Architecture</text>
  <text x="70" y="122" font-family="Inter, PingFang SC, sans-serif" font-size="19" fill="#AFC0E8">前端交互 → 服务编排 → Agent 执行 → 数据沉淀 + 实时回流</text>

  <!-- Layer Tags -->
  <rect x="70" y="160" width="170" height="34" rx="17" fill="#172546" stroke="#35589B"/>
  <text x="96" y="183" font-family="Inter, PingFang SC, sans-serif" font-size="14" fill="#CFE1FF" font-weight="600">STEP 01</text>
  <rect x="450" y="160" width="170" height="34" rx="17" fill="#172546" stroke="#35589B"/>
  <text x="476" y="183" font-family="Inter, PingFang SC, sans-serif" font-size="14" fill="#CFE1FF" font-weight="600">STEP 02</text>
  <rect x="830" y="160" width="170" height="34" rx="17" fill="#172546" stroke="#35589B"/>
  <text x="856" y="183" font-family="Inter, PingFang SC, sans-serif" font-size="14" fill="#CFE1FF" font-weight="600">STEP 03</text>
  <rect x="1210" y="160" width="170" height="34" rx="17" fill="#172546" stroke="#35589B"/>
  <text x="1236" y="183" font-family="Inter, PingFang SC, sans-serif" font-size="14" fill="#CFE1FF" font-weight="600">STEP 04</text>

  <!-- 4 main columns -->
  <rect x="70" y="214" width="340" height="420" rx="18" fill="url(#panel)" stroke="#3D5B96"/>
  <rect x="450" y="214" width="340" height="420" rx="18" fill="url(#panel)" stroke="#3D5B96"/>
  <rect x="830" y="214" width="340" height="420" rx="18" fill="url(#panel)" stroke="#3D5B96"/>
  <rect x="1210" y="214" width="320" height="420" rx="18" fill="url(#panel)" stroke="#4E5FA0"/>

  <text x="96" y="258" font-family="Inter, PingFang SC, sans-serif" font-size="24" fill="#ECF2FF" font-weight="700">Interaction Layer</text>
  <text x="96" y="290" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• WTT Web（Feed / Tasks / Inbox）</text>
  <text x="96" y="320" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• 用户输入（message / slash / mention）</text>
  <text x="96" y="350" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• Topic 上下文和 Agent 选择</text>
  <text x="96" y="380" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• 实时渲染 typing / task_status</text>

  <text x="476" y="258" font-family="Inter, PingFang SC, sans-serif" font-size="24" fill="#ECF2FF" font-weight="700">WTT Service Layer</text>
  <text x="476" y="290" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• REST / WS（topics / tasks / agents）</text>
  <text x="476" y="320" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• owner/runner 校验与鉴权</text>
  <text x="476" y="350" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• discuss 命令定向规则</text>
  <text x="476" y="380" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• 广播 new_message / status / typing</text>

  <text x="856" y="258" font-family="Inter, PingFang SC, sans-serif" font-size="24" fill="#ECF2FF" font-weight="700">Agent Runtime Layer</text>
  <text x="856" y="290" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• wtt_plugin 命令桥接</text>
  <text x="856" y="320" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• OpenClaw Gateway 分发</text>
  <text x="856" y="350" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• 模型推理与工具执行</text>
  <text x="856" y="380" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C8D6F2">• summary / asset 产出</text>

  <text x="1236" y="258" font-family="Inter, PingFang SC, sans-serif" font-size="24" fill="#ECF2FF" font-weight="700">Data Layer</text>
  <text x="1236" y="290" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#D4D9F8">• PostgreSQL（任务/消息/成员）</text>
  <text x="1236" y="320" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#D4D9F8">• Redis（在线连接/缓存）</text>
  <text x="1236" y="350" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#D4D9F8">• 产物链接 / commit 归档</text>

  <!-- arrows main -->
  <line x1="410" y1="435" x2="450" y2="435" stroke="#8FA4D8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="790" y1="435" x2="830" y2="435" stroke="#8FA4D8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1170" y1="435" x2="1210" y2="435" stroke="#8FA4D8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Realtime rail -->
  <rect x="70" y="666" width="1460" height="156" rx="18" fill="#101B3A" stroke="#2F4D8A"/>
  <text x="96" y="706" font-family="Inter, PingFang SC, sans-serif" font-size="25" fill="#E9F0FF" font-weight="700">Realtime Feedback Rail</text>
  <text x="96" y="738" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C5D3F2">• WS 事件：task_status / typing / new_message 实时回流到前端视图</text>
  <text x="96" y="764" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C5D3F2">• 质量闭环：review / reject / rerun 可回退到执行层继续迭代</text>
  <text x="96" y="790" font-family="Inter, PingFang SC, sans-serif" font-size="16" fill="#C5D3F2">• 交付证据：summary + asset + commit id 形成可追踪结果</text>

  <path d="M1320 666C1320 618 980 618 980 634" stroke="#60A5FA" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow2)" filter="url(#glow)"/>
  <path d="M980 634C980 598 220 598 220 666" stroke="#60A5FA" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow2)" filter="url(#glow)"/>
</svg>
