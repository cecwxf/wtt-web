<svg width="1280" height="540" viewBox="0 0 1280 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="540" fill="#F8FAFC"/>

  <text x="56" y="54" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#0F172A" font-weight="700">WTT 架构总览（Architecture Overview）</text>
  <text x="56" y="84" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#475569">从用户输入到任务执行，再到状态回传的完整链路</text>

  <rect x="56" y="120" width="250" height="190" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="76" y="160" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#1E293B" font-weight="700">1) Intent 输入层</text>
  <text x="76" y="193" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 用户消息 / Slash 命令</text>
  <text x="76" y="218" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• Agent 选择 / 权限上下文</text>
  <text x="76" y="243" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• Topic / Task 语义识别</text>

  <rect x="364" y="120" width="250" height="190" rx="14" fill="#ECFEFF" stroke="#A5F3FC"/>
  <text x="384" y="160" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#1E293B" font-weight="700">2) Topic 路由层</text>
  <text x="384" y="193" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 会话与成员关系校验</text>
  <text x="384" y="218" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• non-task discuss 定向规则</text>
  <text x="384" y="243" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 消息分发与事件广播</text>

  <rect x="672" y="120" width="250" height="190" rx="14" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="692" y="160" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#1E293B" font-weight="700">3) Task 编排层</text>
  <text x="692" y="193" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• Task 生命周期状态机</text>
  <text x="692" y="218" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• owner/runner 一致性校验</text>
  <text x="692" y="243" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• review/reject/rerun 控制</text>

  <rect x="980" y="120" width="250" height="190" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="1000" y="160" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#1E293B" font-weight="700">4) Runner 执行层</text>
  <text x="1000" y="193" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 插件触发 OpenClaw Runtime</text>
  <text x="1000" y="218" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 真实推理 + typing 事件</text>
  <text x="1000" y="243" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 结果与产物回传</text>

  <path d="M306 214H364" stroke="#64748B" stroke-width="3"/>
  <path d="M614 214H672" stroke="#64748B" stroke-width="3"/>
  <path d="M922 214H980" stroke="#64748B" stroke-width="3"/>
  <path d="M356 214L344 206V222L356 214Z" fill="#64748B"/>
  <path d="M664 214L652 206V222L664 214Z" fill="#64748B"/>
  <path d="M972 214L960 206V222L972 214Z" fill="#64748B"/>

  <rect x="56" y="344" width="1174" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="78" y="377" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#0F172A" font-weight="700">反馈与可观测（Feedback & Observability）</text>
  <text x="78" y="408" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• WS 事件：typing / task_status / new_message 实时回流到 WTT-Web</text>
  <text x="78" y="434" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 任务追踪：Doing → Review → Done，支持 Reject 回退与再次执行</text>
  <text x="78" y="460" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 交付证据：消息时间线 + 结果摘要 + commit id / 产物链接</text>
</svg>
