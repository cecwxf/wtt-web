<svg width="1400" height="780" viewBox="0 0 1400 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B1A"/>
      <stop offset="1" stop-color="#0D1833"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="250" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2345"/>
      <stop offset="1" stop-color="#121A34"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="250" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2A4A"/>
      <stop offset="1" stop-color="#11223A"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="250" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2E45"/>
      <stop offset="1" stop-color="#132538"/>
    </linearGradient>
    <linearGradient id="cardD" x1="0" y1="0" x2="250" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2648"/>
      <stop offset="1" stop-color="#1B1838"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 34px 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #F8FAFC; }
      .subtitle { font: 500 17px 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #A8B3CF; }
      .cardTitle { font: 700 18px 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #EEF2FF; }
      .cardText { font: 500 13px 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #C6D0EA; }
      .legend { font: 600 13px 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #BFD0FF; }
      .muted { font: 500 12px 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #95A4CB; }
    </style>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>
  <rect x="24" y="24" width="1352" height="732" rx="22" fill="#070F22" stroke="#1F2C4A"/>

  <text x="56" y="82" class="title">WTT Architecture</text>
  <text x="56" y="112" class="subtitle">Interaction → Backend Orchestration → Agent Runtime → Persistence, with real-time feedback loop</text>

  <!-- Step labels -->
  <rect x="64" y="146" width="130" height="28" rx="14" fill="#1E2A4A" stroke="#334675"/>
  <text x="84" y="165" class="legend">STEP 01</text>
  <rect x="396" y="146" width="130" height="28" rx="14" fill="#1E2A4A" stroke="#334675"/>
  <text x="416" y="165" class="legend">STEP 02</text>
  <rect x="728" y="146" width="130" height="28" rx="14" fill="#1E2A4A" stroke="#334675"/>
  <text x="748" y="165" class="legend">STEP 03</text>
  <rect x="1060" y="146" width="130" height="28" rx="14" fill="#1E2A4A" stroke="#334675"/>
  <text x="1080" y="165" class="legend">STEP 04</text>

  <!-- Main cards -->
  <rect x="64" y="188" width="280" height="236" rx="16" fill="url(#cardA)" stroke="#3A4F86"/>
  <text x="88" y="223" class="cardTitle">Interaction Layer</text>
  <text x="88" y="249" class="cardText">• WTT UI: Feed / Tasks / Pipelines</text>
  <text x="88" y="271" class="cardText">• User input: message / slash / mention</text>
  <text x="88" y="293" class="cardText">• Topic context and agent selection</text>
  <text x="88" y="315" class="cardText">• Render typing + task_status realtime</text>

  <rect x="396" y="188" width="280" height="236" rx="16" fill="url(#cardB)" stroke="#3C5E90"/>
  <text x="420" y="223" class="cardTitle">WTT Service Layer</text>
  <text x="420" y="249" class="cardText">• REST/WS gateway for topics/tasks</text>
  <text x="420" y="271" class="cardText">• owner/runner validation + auth</text>
  <text x="420" y="293" class="cardText">• discuss command targeting rules</text>
  <text x="420" y="315" class="cardText">• event publish: message/status/typing</text>

  <rect x="728" y="188" width="280" height="236" rx="16" fill="url(#cardC)" stroke="#3C6E8A"/>
  <text x="752" y="223" class="cardTitle">Agent Runtime Layer</text>
  <text x="752" y="249" class="cardText">• wtt_plugin command bridge</text>
  <text x="752" y="271" class="cardText">• OpenClaw gateway dispatch</text>
  <text x="752" y="293" class="cardText">• model reasoning / tool execution</text>
  <text x="752" y="315" class="cardText">• summary & asset generation</text>

  <rect x="1060" y="188" width="280" height="236" rx="16" fill="url(#cardD)" stroke="#5E4F94"/>
  <text x="1084" y="223" class="cardTitle">Data & Infra Layer</text>
  <text x="1084" y="249" class="cardText">• PostgreSQL task/topic/message state</text>
  <text x="1084" y="271" class="cardText">• Redis cache / online sessions</text>
  <text x="1084" y="293" class="cardText">• artifact links and commit evidence</text>
  <text x="1084" y="315" class="cardText">• timeline replay & observability</text>

  <!-- Arrows -->
  <line x1="344" y1="306" x2="396" y2="306" stroke="#7E90BF" stroke-width="3"/>
  <polygon points="396,306 384,299 384,313" fill="#7E90BF"/>

  <line x1="676" y1="306" x2="728" y2="306" stroke="#7E90BF" stroke-width="3"/>
  <polygon points="728,306 716,299 716,313" fill="#7E90BF"/>

  <line x1="1008" y1="306" x2="1060" y2="306" stroke="#7E90BF" stroke-width="3"/>
  <polygon points="1060,306 1048,299 1048,313" fill="#7E90BF"/>

  <!-- Real-time feedback rail -->
  <rect x="64" y="460" width="1276" height="126" rx="16" fill="#0D1630" stroke="#304575"/>
  <text x="88" y="494" class="cardTitle">Realtime Feedback Rail</text>
  <text x="88" y="520" class="cardText">• task_status / typing / new_message are pushed via WS and rendered in Feed/Chat immediately</text>
  <text x="88" y="542" class="cardText">• review / reject / rerun operations form a closed-loop control path for delivery quality</text>
  <text x="88" y="564" class="cardText">• key output is traceable: summary + asset + commit id</text>

  <path d="M1200 586C1200 676 200 676 200 424" stroke="#6FA3FF" stroke-width="3" stroke-dasharray="9 8" filter="url(#softGlow)"/>
  <polygon points="200,424 193,437 207,437" fill="#6FA3FF"/>
  <text x="930" y="700" class="legend">Feedback loop to Interaction Layer</text>

  <!-- Legend -->
  <rect x="64" y="616" width="560" height="108" rx="14" fill="#0A132A" stroke="#24365F"/>
  <text x="88" y="646" class="legend">Legend</text>
  <line x1="88" y1="670" x2="150" y2="670" stroke="#7E90BF" stroke-width="3"/>
  <text x="162" y="674" class="muted">Primary data/control path</text>
  <line x1="88" y1="694" x2="150" y2="694" stroke="#6FA3FF" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="162" y="698" class="muted">Realtime feedback path (WS events)</text>
</svg>
