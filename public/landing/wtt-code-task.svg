    <text x="234" y="146" fill="#89b4fa">export const</text><text x="310" y="146" fill="#f9e2af"> authRouter</text><text x="388" y="146" fill="#cdd6f4"> = Router()</text>

    <text x="234" y="160" fill="#6c7086"></text>
    <text x="234" y="174" fill="#cdd6f4">authRouter.</text><text x="306" y="174" fill="#89b4fa">get</text><text x="324" y="174" fill="#cdd6f4">(</text><text x="330" y="174" fill="#a6e3a1">'/callback'</text><text x="406" y="174" fill="#cdd6f4">,</text>
    <rect x="204" y="181" width="356" height="14" fill="#16a34a" opacity="0.12"/>
    <text x="246" y="188" fill="#cba6f7">async</text><text x="278" y="188" fill="#cdd6f4"> (req, res) =&gt; {</text>
    <rect x="204" y="195" width="356" height="14" fill="#16a34a" opacity="0.12"/>
    <text x="258" y="202" fill="#89b4fa">const</text><text x="290" y="202" fill="#cdd6f4"> token = </text><text x="346" y="202" fill="#cba6f7">await</text><text x="378" y="202" fill="#cdd6f4"> verifyJWT(</text>
    <text x="270" y="216" fill="#cdd6f4">req.headers.authorization</text>
    <text x="258" y="230" fill="#cdd6f4">)</text>

    <rect x="204" y="237" width="356" height="14" fill="#16a34a" opacity="0.12"/>
    <text x="258" y="244" fill="#cba6f7">if</text><text x="274" y="244" fill="#cdd6f4"> (!token) </text><text x="334" y="244" fill="#cba6f7">return</text><text x="370" y="244" fill="#cdd6f4"> res.</text><text x="392" y="244" fill="#89b4fa">status</text><text x="424" y="244" fill="#cdd6f4">(401)</text>
    <text x="258" y="258" fill="#cdd6f4">res.json({ user: token.sub })</text>
    <text x="246" y="272" fill="#cdd6f4">})</text>
    <text x="234" y="286" fill="#6c7086">// TODO: add refresh token</text>
