    <text x="234" y="118" fill="#cba6f7">import</text><text x="270" y="118" fill="#cdd6f4"> { verifyJWT } </text><text x="360" y="118" fill="#cba6f7">from</text><text x="388" y="118" fill="#a6e3a1"> './utils'</text>
    <text x="234" y="132" fill="#6c7086">// OAuth callback handler</text>

