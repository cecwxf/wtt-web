<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="560" fill="#F1F5F9"/>

  <text x="56" y="54" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#0F172A" font-weight="700">WTT 任务交付流程（Task Delivery Flow）</text>
  <text x="56" y="84" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#475569">清晰展示：创建 → 执行 → 评审 → 完成，并支持 reject 回路</text>

  <rect x="72" y="140" width="250" height="180" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="96" y="182" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#1E293B" font-weight="700">STEP 1 创建</text>
  <text x="96" y="214" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 新建任务（code/research/common）</text>
  <text x="96" y="239" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 绑定 owner / runner</text>
  <text x="96" y="264" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 进入 Doing</text>

  <rect x="366" y="140" width="250" height="180" rx="14" fill="#ECFEFF" stroke="#A5F3FC"/>
  <text x="390" y="182" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#1E293B" font-weight="700">STEP 2 执行</text>
  <text x="390" y="214" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• Runner 推理执行</text>
  <text x="390" y="239" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• typing / 状态事件回传</text>
  <text x="390" y="264" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 产物与摘要生成</text>

  <rect x="660" y="140" width="250" height="180" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="684" y="182" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#1E293B" font-weight="700">STEP 3 评审</text>
  <text x="684" y="214" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 进入 Review</text>
  <text x="684" y="239" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 人工确认 / 机器检查</text>
  <text x="684" y="264" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 可 Approve 或 Reject</text>

  <rect x="954" y="140" width="250" height="180" rx="14" fill="#F0FDF9" stroke="#BBF7D0"/>
  <text x="978" y="182" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#1E293B" font-weight="700">STEP 4 完成</text>
  <text x="978" y="214" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• Done + 结果沉淀</text>
  <text x="978" y="239" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 提交记录 / 链接归档</text>
  <text x="978" y="264" font-size="15" font-family="Arial, Helvetica, sans-serif" fill="#334155">• 可回放与复盘</text>

  <path d="M322 225H366" stroke="#6B7280" stroke-width="3"/>
  <path d="M616 225H660" stroke="#6B7280" stroke-width="3"/>
  <path d="M910 225H954" stroke="#6B7280" stroke-width="3"/>
  <path d="M358 225L346 217V233L358 225Z" fill="#6B7280"/>
  <path d="M652 225L640 217V233L652 225Z" fill="#6B7280"/>
  <path d="M946 225L934 217V233L946 225Z" fill="#6B7280"/>

  <path d="M785 320C785 390 520 390 520 320" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M530 320L544 312V328L530 320Z" fill="#F59E0B"/>
  <text x="545" y="386" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#B45309">Reject / 补充意见 → 回到 Doing 继续执行</text>

  <rect x="72" y="420" width="1132" height="96" rx="14" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="94" y="456" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">关键信号：task_status（实时状态） / typing（推理中） / summary（结果） / asset（产物）</text>
  <text x="94" y="484" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">关键约束：owner/runner 不为空，task-topic 与 p2p 可无 @ 触发，discuss 按规则定向</text>
</svg>
